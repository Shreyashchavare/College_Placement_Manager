version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: placement_postgres
    environment:
      POSTGRES_DB: placement_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - placement_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: placement_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-PlacementManagerDevSecretKeyMin32CharsLocalOnly!}
      CORS_ORIGINS: http://localhost,http://localhost:5173,http://localhost:80
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - placement_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement_frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - placement_network

networks:
  placement_network:
    driver: bridge

volumes:
  pgdata:
