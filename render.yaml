services:
  # 1. Backend Web Service (Spring Boot 3 + Java 21)
  - type: web
    name: placement-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: placement-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://*.onrender.com,http://localhost:5173,http://localhost:80"

  # 2. Frontend Static Site (React 18 + Vite SPA)
  - type: web
    name: placement-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: placement-backend
          property: host

databases:
  # 3. PostgreSQL Database (Free Tier)
  - name: placement-db
    databaseName: placement_db
    user: placement_user
    plan: free
